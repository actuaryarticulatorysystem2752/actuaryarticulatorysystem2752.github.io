<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>balagaraghuram-images | Image Gallery</title>
    <style>
        :root{--bg:#111;--panel:#212;--text:#e6edf3;--muted:#9aa7b4;--accent:#00f;--line:#333;--radius:8px;}
        *{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
        a{color:var(--accent)}
        .wrap{max-width:1200px;margin:0 auto;padding:0 20px}
        header{padding:20px 0;border-bottom:1px solid var(--line)}
        .nav{display:flex;align-items:center;justify-content:space-between}
        .brand{font-weight:700;letter-spacing:.3px;text-decoration:none;color:var(--text)}
        .nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-size:.95rem}
        .nav a:hover{color:var(--text)}
        .hero{padding:32px 0;text-align:center;background:#1a1a2e}
        h1{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:8px;color:#fff}
        h1 span{color:var(--accent)}
        .intro{max-width:720px;margin:0 auto 24px;color:var(--muted);font-size:1.05rem}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding-bottom:48px}
        figure{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.2s;cursor:pointer}
        figure:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.4)}
        .ph{aspect-ratio:4/3;overflow:hidden;background:#0a0e13}
        .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
        figure:hover .ph img{transform:scale(1.05)}
        figcaption{padding:8px 10px 10px}
        .cat{display:inline-block;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
        figcaption h3{font-size:.85rem;margin-bottom:4px}
        figcaption p{font-size:.7rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:.75rem;text-align:center}
    </style>
</head>
<body>
    <header>
        <div class="wrap nav">
            <a class="brand" href="./">balagaraghuram-images<span>.github.io</span></a>
            <nav>
                <a href="#gallery">Gallery</a>
                <a href="https://balagaraghuram.github.io/">Official Site</a>
                <a href="https://github.com/balagaraghuram1">GitHub</a>
                <a href="https://uk.linkedin.com/in/balagaraghuram">LinkedIn</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="wrap">
            <h1>Balaga <em>Raghuram</em> — Image Gallery</h1>
            <p class="intro">A curated selection of photographs documenting conferences, winter schools, and UK travel experiences.</p>
        </div>
    </section>

    <main class="wrap" id="gallery">
        <div class="grid" id="grid">
            <!-- images injected by JS -->
        </div>
    </main>

    <footer>
        <div class="wrap">© 2026 Balaga Raghuram · <a href="https://balagaraghuram.github.io/">balagaraghuram.github.io</a> · Images indexed for Google Images search</div>
    </footer>

    <script>
        const images = [
            {src:'images/00000IMG_00000_BURST20240923145810_COVER.jpg', alt:'Cover image from balagaraghuram.github.io', title:'Cover', caption:''},
            {src:'images/balaga raghuram_ winter school university of edinburgh.jpg', alt:'Balaga Raghuram at winter school', title:'Winter School Edinburgh', caption:'University of Edinburgh winter school'},
            {src:'images/balaga raghuram_zurich international airport.jpg', alt:'Balaga Raghuram at Zurich Airport', title:'Zurich Airport', caption:'Switzerland travel'},
            {src:'images/balaga-raghuram-universityofbirmingham.jpg', alt:'Balaga Raghuram at University of Birmingham', title:'University of Birmingham', caption:'Birmingham university'},
            {src:'images/balaga-raghuram-uk-amazing-snow.jpg', alt:'Balaga Raghuram UK snow', title:'UK Snow', caption:'UK snow experience'},
            {src:'images/balaga-raghram-uob-museum.jpg', alt:'UOB Museum', title:'UOB Museum', caption:''},
            {src:'images/balaga-raghram-uob-museum-trex.jpg', alt:'UOB Museum T-Rex', title:'UOB Museum T-Rex', caption:''},
            {src:'images/balaga-raghuram-google-cloud.jpg', alt:'Google Cloud', title:'Google Cloud', caption:''},
            {src:'images/balaga-raghuram-gcp-cloud-run.jpg', alt:'GCP Cloud Run', title:'Cloud Run', caption:''},
            {src:'images/balaga-raghuram-nhs.jpg', alt:'NHS', title:'NHS', caption:''},
            {src:'images/bignewsnetwork_dubaimedia2.png', alt:'MENAFN logo', title:'MENAFN', caption:''},
            {src:'images/bignewsnetwork_dubaimedia_1.png', alt:'BigNewsNetwork logo', title:'BigNewsNetwork', caption:''},
            {src:'images/logo-abudhabi-reporter.jpg', alt:'Abudhabi Reporter', title:'Abudhabi', caption:''},
            {src:'images/logo-bignewsnetwork.png', alt:'BigNewsNetwork', title:'BigNews', caption:''},
            {src:'images/logo-estate-magazine.jpg', alt:'Estate Magazine', title:'Estate', caption:''},
            {src:'images/logo-menafn.jpg', alt:'MENAFN', title:'MENAFN', caption:''},
            {src:'images/happy new year1.png', alt:'Happy New Year', title:'New Year', caption:''},
            {src:'images/new year poster.jpg', alt:'New Year Poster', title:'New Year Poster', caption:''},
            {src:'images/poster.png', alt:'Poster', title:'Poster', caption:''},
            {src:'images/winterschool1.jpg', alt:'Winter school 1', title:'Winter School 1', caption:''},
            {src:'images/winterschool2.jpg', alt:'Winter school 2', title:'Winter School 2', caption:''},
            {src:'images/balaga-raghuram-cambridge-university-conference.jpg', alt:'Cambridge Conference', title:'Cambridge Conference', caption:'September 2024'},
            {src:'images/balaga-raghuram-newton-institute-cambridge.jpg', alt:'Newton Institute', title:'Newton Institute', caption:'Mathematical formulations'},
            {src:'images/balaga-raghuram-oxford-university-forum.jpg', alt:'Oxford Forum', title:'Oxford Forum', caption:'Nov 2024'},
            {src:'images/balaga-raghuram-edinburgh-winter-school.jpg', alt:'Edinburgh Winter School', title:'Edinburgh WInter School', caption:'Advanced programming'},
            {src:'images/balaga-raghuram-canary-wharf-london.jpg', alt:'Canary Wharf London', title:'Canary Wharf', caption:'London financial district'},
            {src:'images/balaga-raghuram-london-bridge-night.jpg', alt:'London Bridge Night', title:'London Bridge Night', caption:'UK travels'},
            {src:'images/balaga-raghuram-edinburgh-early-morning.jpg', alt:'Edinburgh Early Morning', title:'Edinburgh Morning', caption:'Historic city'},
            {src:'images/balaga-raghuram-london-bridge-night2.jpg', alt:'London Bridge Night 2', title:'London Bridge 2', caption:'UK travel'},
            {src:'images/balaga-raghuram-canary-wharf.jpg', alt:'Canary Wharf', title:'Canary Wharf', caption:''},
            {src:'images/balaga-raghuram-london-bridge-night2.jpg', alt:'London Bridge Night 2', title:'London Bridge 2', caption:'UK travel'}
        ];

        const grid = document.getElementById('grid');
        const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap');
        let idx = 0;

        function renderGallery() {
            grid.innerHTML = '';
            images.forEach((img, i) => {
                const figure = document.createElement('figure');
                figure.innerHTML = '<div class=\"ph\"><img src=\"' + img.src + '\" alt=\"' + img.alt + '\" loading=\"lazy\"></div><figcaption><span class=\"cat\">Gallery</span><h3>' + img.title + '</h3><p>' + img.caption + '</p></figcaption>';
                figure.querySelector('img').addEventListener('click', () => openFigure(figure));
                grid.appendChild(figure);
            });
        }

        function openFigure(figure) {
            const visible = () => [...grid.querySelectorAll('figure')].filter(f => f.style.display !== 'none');
            const list = visible(); idx = list.indexOf(figure); showList(list);
        }
        function showList(list) {
            const f = list[idx];
            lbImg.src = f.querySelector('img').src;
            lbImg.alt = f.querySelector('img').alt;
            lbCap.innerHTML = f.querySelector('figcaption').innerHTML;
            lb.classList.add('open');
        }
        document.getElementById('lbClose').onclick = () => lb.classList.remove('open');
        document.getElementById('lbPrev').onclick = e => { e.stopPropagation(); const l = visible(); idx = (idx-1+l.length)%l.length; showList(l) };
        document.getElementById('lbNext').onclick = e => { e.stopPropagation(); const l = visible(); idx = (idx+1)%l.length; showList(l) };
        lb.addEventListener('click',e=>{if(e.target===lb)lb.classList.remove('open')});
        document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')document.getElementById('lbPrev').click();if(e.key==='ArrowRight')document.getElementById('lbNext').click()});
        renderGallery();
    </script>
</body>
</html>
