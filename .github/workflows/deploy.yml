name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A0E36B: ${{ secrets.A0E36B }}
          B6CE57: ${{ secrets.B6CE57 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A0E36B', '')
          bm = os.environ.get('B6CE57', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- c12c9c4bd8e9a28e6c3ba2cbd40e -->', gm)
          if bm:
              s2 = s2.replace('<!-- 2b3b36d14f0db6e985f36a9afc86d4a3c5f74919d95cd0eb -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
